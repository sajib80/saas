    <script>
      (function() {
        try {
          if (typeof window !== 'undefined' && window.fetch) {
            var nativeFetch = window.fetch.bind(window);
            var customFetch = null;
            var safeFetch = function() {
              var fn = customFetch || nativeFetch;
              return fn.apply(window, arguments);
            };

            try {
              Object.defineProperty(window, 'fetch', {
                get: function() {
                  return safeFetch;
                },
                set: function(fn) {
                  customFetch = typeof fn === 'function' ? fn : null;
                },
                configurable: true,
                enumerable: true
              });
            } catch (e1) {
              try {
                if (window.Window && window.Window.prototype) {
                  Object.defineProperty(window.Window.prototype, 'fetch', {
                    get: function() {
                      return safeFetch;
                    },
                    set: function(fn) {
                      customFetch = typeof fn === 'function' ? fn : null;
                    },
                    configurable: true,
                    enumerable: true
                  });
                }
              } catch (e2) {}
            }
          }
        } catch (err) {}
      })();
    </script>
